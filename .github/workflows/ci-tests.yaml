name: Allure Smoke Test (Linux)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install dependencies
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright allure-pytest
          python -m playwright install

      # 4. Create minimal smoke test z poprawnym wcięciem
      - name: Create minimal smoke test
        run: |
          mkdir -p tests
          cat > tests/test_allure_smoke.py << 'EOF'

        def test_allure_smoke():
          with allure.step("Linux Allure step"):
            assert True
            EOF


      # 5. Run pytest wskazując katalog tests/ i generując allure-results
      - name: Pytest run
        run: pytest tests/ --alluredir=allure-results -v

      # 6. List generated allure-results (do debug)
      - name: List allure-results
        run: ls -R allure-results

      # 7. Install Allure CLI
      - name: Install Allure CLI
        run: |
          VERSION=2.29.0
          wget https://github.com/allure-framework/allure2/releases/download/$VERSION/allure-$VERSION.zip -O allure.zip
          unzip allure.zip
          echo "ALLURE_BIN=$(pwd)/allure-$VERSION/bin/allure" >> $GITHUB_ENV

      # 8. Generate Allure HTML report
      - name: Generate Allure HTML report
        run: $ALLURE_BIN generate allure-results -o allure-report --clean

      # 9. Upload allure-results JSONs
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # 10. Upload generated HTML report
      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
