name: Playwright Python Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install

      - name: Ensure allure-results folder exists
        shell: pwsh
        run: |
          if (!(Test-Path "allure-results")) {
            New-Item -ItemType Directory -Path "allure-results"
          }


      - name: Run Playwright tests
        shell: pwsh
        run: |
          if (!(Test-Path "allure-results")) { New-Item -ItemType Directory -Path "allure-results" }
          pytest -vv -s --alluredir=allure-results
      

      - name: DEBUG – list allure-results
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== allure-results content ==="
          if (Test-Path "allure-results") {
            Get-ChildItem "allure-results" -Recurse
          } else {
            Write-Host "❌ allure-results folder does NOT exist"
          }

      - name: Install Allure CLI (Windows)
        shell: pwsh
        run: |
          $version = "2.29.0"
          $zip = "$env:RUNNER_TEMP\allure.zip"
          $installDir = "$env:RUNNER_TEMP\allure"

          Invoke-WebRequest `
            -Uri "https://github.com/allure-framework/allure2/releases/download/$version/allure-$version.zip" `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $installDir

          $allureCmd = Join-Path "$installDir\allure-$version\bin" "allure.bat"
          & $allureCmd --version

          echo "ALLURE_CMD=$allureCmd" >> $env:GITHUB_ENV

      - name: Generate Allure HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "allure-results") {
            & "$env:ALLURE_CMD" generate "allure-results" -o "allure-report" --clean
          } else {
            Write-Host "No allure-results folder, skipping report generation"
          }

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
