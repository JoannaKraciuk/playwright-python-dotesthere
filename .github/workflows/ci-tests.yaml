
name: Minimal Playwright + Allure Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install
          

      - name: REMOVE pytest.ini for CI
        shell: pwsh
        run: |
          if (Test-Path "pytest.ini") {
            Remove-Item "pytest.ini"
            Write-Host "pytest.ini removed for clean CI run"
          }


      - name: Run pytest (GENERATE ALLURE RESULTS)
        shell: pwsh
        run: |
          pytest --alluredir=allure-results

      - name: List allure-results (DEBUG)
        if: always()
        shell: pwsh
        run: |
          echo "=== allure-results ==="
          Get-ChildItem "allure-results" -Recurse

      - name: Install Allure CLI (Windows)
        if: always()
        shell: pwsh
        run: |
          $version = "2.29.0"
          $zip = "$env:RUNNER_TEMP\allure.zip"
          $installDir = "$env:RUNNER_TEMP\allure"
          Invoke-WebRequest -Uri "https://github.com/allure-framework/allure2/releases/download/$version/allure-$version.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $installDir
          $allureCmd = Join-Path "$installDir\allure-$version\bin" "allure.bat"
          echo "ALLURE_CMD=$allureCmd" >> $env:GITHUB_ENV

      - name: Generate Allure HTML report
        if: always()
        shell: pwsh
        run: |
          & "$env:ALLURE_CMD" generate "allure-results" -o "allure-report" --clean

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
