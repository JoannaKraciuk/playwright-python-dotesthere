name: Playwright Python Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          retry: 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install

      - name: Run Playwright tests
        shell: pwsh
        run: |
          pytest -vv -s --alluredir=allure-results || echo "Tests failed"

      - name: List Allure results
        shell: pwsh
        run: |
          if (Test-Path "allure-results") {
            Get-ChildItem "allure-results" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "Folder allure-results does not exist!"
          }

      - name: Generate Allure HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "allure-results") {
            & "$env:ALLURE_CMD" generate "allure-results" -o "allure-report" --clean
          } else {
            Write-Host "No allure-results folder, skipping HTML report"
          }

      - name: Install Allure CLI
        shell: pwsh
        run: |
          $version = "2.29.0"
          $zip = "$env:RUNNER_TEMP\allure.zip"
          $installDir = "$env:RUNNER_TEMP\allure"

          Invoke-WebRequest -Uri "https://github.com/allure-framework/allure2/releases/download/$version/allure-$version.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $installDir

          $allureCmd = Join-Path "$installDir\allure-$version\bin" "allure.bat"
          & $allureCmd --version
          echo "ALLURE_CMD=$allureCmd" >> $env:GITHUB_ENV

      - name: Generate Allure HTML report
        if: always()
        shell: pwsh
        run: |
          & "$env:ALLURE_CMD" generate "allure-results" -o "allure-report" --clean

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error

      - name: List Allure results
        shell: pwsh
        run: |
          if (Test-Path "allure-results") {
            Get-ChildItem "allure-results" -Recurse
          } else {
            Write-Host "Folder allure-results does not exist!"
          }
