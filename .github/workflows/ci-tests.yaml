
name: Allure Smoke Test (Windows)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1) W CI ignorujemy pytest.ini (żeby żaden addopts nie psuł wyniku)
      - name: REMOVE pytest.ini for CI
        shell: pwsh
        run: |
          if (Test-Path "pytest.ini") {
            Remove-Item "pytest.ini"
            Write-Host "pytest.ini removed for clean CI run"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 2) Minimalne paczki – bez requirements.txt, żeby wykluczyć konflikty
      - name: Install minimal deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright allure-pytest
          python -m playwright install

      # 3) Tworzymy minimalny test na żywo (gwarantujemy 1 test)
      - name: Create minimal smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests | Out-Null
          @'
import allure

def test_allure_smoke():
    with allure.step("Step: smoke"):
        assert True
'@ | Set-Content -Path tests\test_allure_smoke.py -Encoding UTF8

      # 4) Pokaż co pytest zbierze – musi być co najmniej 1 test
      - name: DEBUG – pytest collect-only
        shell: pwsh
        run: |
          Write-Host "=== pytest --collect-only ==="
          pytest --collect-only -q || exit 0

      # 5) Uruchamiamy test i zapisujemy do allure-results
      - name: Run pytest (generate allure-results)
        shell: pwsh
        run: |
          pytest -q --alluredir=allure-results .

      # 6) Sprawdźmy zawartość allure-results i przerwijmy job, jeśli pusto
      - name: DEBUG – list allure-results
        shell: pwsh
        run: |
          Write-Host "=== allure-results content ==="
          if (Test-Path "allure-results") {
            Get-ChildItem "allure-results" -Recurse | ForEach-Object { $_.FullName }
          } else {
            Write-Host "❌ allure-results folder does NOT exist"
          }

      - name: Fail if no allure results
        shell: pwsh
        run: |
          if (-not (Test-Path "allure-results")) {
            Write-Error "❌ allure-results directory not found"
            exit 1
          }
          $files = Get-ChildItem "allure-results" -File -Recurse -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Error "❌ No files in allure-results (pytest did not produce results)"
            exit 1
          } else {
            Write-Host "Found $($files.Count) file(s) in allure-results:"
            $files | ForEach-Object { "  - " + $_.Name } | Write-Host
          }

      # 7) Pobierz Allure CLI i zrób raport HTML
      - name: Install Allure CLI (Windows)
        if: always()
        shell: pwsh
        run: |
          $version = "2.29.0"
          $zip = "$env:RUNNER_TEMP\allure.zip"
          $installDir = "$env:RUNNER_TEMP\allure"
          Invoke-WebRequest -Uri "https://github.com/allure-framework/allure2/releases/download/$version/allure-$version.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $installDir
          $allureCmd = Join-Path "$installDir\allure-$version\bin" "allure.bat"
          & $allureCmd --version
          echo "ALLURE_CMD=$allureCmd" >> $env:GITHUB_ENV

      - name: Generate Allure HTML report
        if: always()
        shell: pwsh
        run: |
          & "$env:ALLURE_CMD" generate "allure-results" -o "allure-report" --clean

      # 8) Upload DWÓCH artefaktów: results + report
      - name: Upload raw allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: error

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
