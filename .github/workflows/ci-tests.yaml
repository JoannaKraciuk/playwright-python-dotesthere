name: Playwright Python Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and Playwright
        shell: pwsh
        run: |
          python -m venv .venv
          $python = ".\.venv\Scripts\python.exe"
          # Zaktualizuj pip
          & $python -m pip install --upgrade pip
          # Zainstaluj wszystkie zależności wymuszając reinstalację
          & $python -m pip install --force-reinstall --no-cache-dir -r requirements.txt
          # Teraz zainstaluj Playwright CLI
          & $python -m playwright install

      - name: Run tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -vv -s --alluredir allure-results || true
        continue-on-error: true

