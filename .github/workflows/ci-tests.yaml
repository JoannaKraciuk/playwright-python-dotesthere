name: Playwright Python Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          retry: 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Playwright system deps
        uses: microsoft/playwright-github-action@v1

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install

      - name: Run Playwright tests
        shell: pwsh
        run: |
          pytest -vv -s \
            --alluredir=allure-results \
            --browser=chromium \
            --output=test-results \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --tracing=retain-on-failure || echo "Tests failed"

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Install Allure CLI
        shell: pwsh
        run: |
          $version = "2.29.0"
          $zip = "$env:RUNNER_TEMP\allure.zip"
          $installDir = "$env:RUNNER_TEMP\allure"

          Invoke-WebRequest -Uri "https://github.com/allure-framework/allure2/releases/download/$version/allure-$version.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $installDir

          $allureCmd = Join-Path "$installDir\allure-$version\bin" "allure.bat"
          & $allureCmd --version
          echo "ALLURE_CMD=$allureCmd" >> $env:GITHUB_ENV

      - name: Generate Allure HTML report
        if: always()
        shell: pwsh
        run: |
          & $env:ALLURE_CMD generate allure-results -o allure-report --clean

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error