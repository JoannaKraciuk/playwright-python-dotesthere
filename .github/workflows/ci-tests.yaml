name: Playwright + Allure

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Clean old artifacts
        run: |
          rm -rf allure-results allure-report
          mkdir -p allure-results

      - name: Run pytest (headless)
        run: pytest -vv --alluredir=allure-results

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Install Allure CLI
        if: always()
        run: |
          VERSION=2.29.0
          curl -sL https://github.com/allure-framework/allure2/releases/download/${VERSION}/allure-${VERSION}.zip -o allure.zip
          unzip -q allure.zip
          echo "${{ github.workspace }}/allure-${VERSION}/bin" >> $GITHUB_PATH

      - name: Generate Allure HTML report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7
