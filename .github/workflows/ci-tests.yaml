
name: Playwright Python Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Playwright system deps
        uses: microsoft/playwright-github-action@v1

      - name: DEBUG Show requirements.txt
        run: |
          echo "==== REQUIREMENTS FILE ===="
          cat requirements.txt


      - name: Install dependencies and Playwright
        shell: pwsh
        run: |
          python -m venv .venv
          $python = ".\.venv\Scripts\python.exe"

          # ⛔ Najważniejsze — aktualizacja pip przed wszystkim
          & $python -m pip install --upgrade pip

          # ⛔ Zakaz zmian pip podczas instalacji requirements
          & $python -m pip install --no-deps --upgrade pip

          # ⭕ Instalacja bibliotek bez modyfikacji pip
          & $python -m pip install --no-build-isolation -r requirements.txt

          # Instalacja Playwright CLI
          & $python -m playwright install
      

      - name: Run tests
        run: |
          pytest -vv -s --alluredir=allure-results || true
        continue-on-error: true
