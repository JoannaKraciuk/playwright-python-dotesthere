
name: Allure Smoke Test (Linux)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright allure-pytest
          python -m playwright install

      - name: Create minimal smoke test
        run: |
          mkdir -p tests
          cat > tests/test_allure_smoke.py << 'EOF'
          import allure
          
          def test_allure_smoke():
              with allure.step("Linux Allure step"):
                  assert True
          EOF

      - name: Pytest run
        run: |
          pytest --alluredir=allure-results .

      - name: List allure-results
        run: |
          echo "=== allure-results ==="
          ls -R allure-results

      - name: Install Allure CLI
        run: |
          VERSION=2.29.0
          wget https://github.com/allure-framework/allure2/releases/download/$VERSION/allure-$VERSION.zip -O allure.zip
          unzip allure.zip
          echo "ALLURE_BIN=$(pwd)/allure-$VERSION/bin/allure" >> $GITHUB_ENV

      - name: Generate Allure HTML report
        run: |
          $ALLURE_BIN generate allure-results -o allure-report --clean

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
