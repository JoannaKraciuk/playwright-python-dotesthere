[pytest]
addopts =
    --browser=chromium
    --output=test-results
    --screenshot=only-on-failure
    --full-page-screenshot
    --video=retain-on-failure
    --tracing=retain-on-failure
    --alluredir allure-results
    --clean-alluredir
markers =
    ui: testy interfejsu
    negative: scenariusze negatywne
    smoke: szybkie testy krytyczne